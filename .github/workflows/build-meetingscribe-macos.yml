name: Build MeetingScribe for macOS

on:
  pull_request:
    paths:
      - "tools/meetingscribe/**"
      - ".github/workflows/build-meetingscribe-macos.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  OLLAMA_VERSION: v0.40.2
  OLLAMA_SHA256: 2e2ecb82c47a690887e8ca4be23ed833e1dd229bd03dee80e6a444ccc78e2a78

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: Apple-Silicon
          - runner: macos-15-intel
            architecture: Intel
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: tools/meetingscribe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/meetingscribe/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate audio, recording, and updater logic
        timeout-minutes: 3
        env:
          # Qt's offscreen plug-in can stall on hosted macOS runners. The
          # minimal plug-in exercises widgets without opening real windows.
          QT_QPA_PLATFORM: minimal
        run: |
          python -u -m unittest -v \
            tests.test_audio_cleanup \
            tests.test_live_transcription \
            tests.test_macos_packaging \
            tests.test_screen_recording \
            tests.test_speaker_labels \
            tests.test_updater

      - name: Validate interface
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: minimal
        run: python -u -m unittest -v tests.test_ui

      - name: Create macOS app icon
        run: |
          mkdir -p assets/meetingscribe-icon.iconset
          sips -z 16 16 assets/meetingscribe-icon.png --out assets/meetingscribe-icon.iconset/icon_16x16.png
          sips -z 32 32 assets/meetingscribe-icon.png --out assets/meetingscribe-icon.iconset/icon_16x16@2x.png
          sips -z 32 32 assets/meetingscribe-icon.png --out assets/meetingscribe-icon.iconset/icon_32x32.png
          sips -z 64 64 assets/meetingscribe-icon.png --out assets/meetingscribe-icon.iconset/icon_32x32@2x.png
          sips -z 128 128 assets/meetingscribe-icon.png --out assets/meetingscribe-icon.iconset/icon_128x128.png
          sips -z 256 256 assets/meetingscribe-icon.png --out assets/meetingscribe-icon.iconset/icon_128x128@2x.png
          sips -z 256 256 assets/meetingscribe-icon.png --out assets/meetingscribe-icon.iconset/icon_256x256.png
          sips -z 512 512 assets/meetingscribe-icon.png --out assets/meetingscribe-icon.iconset/icon_256x256@2x.png
          sips -z 512 512 assets/meetingscribe-icon.png --out assets/meetingscribe-icon.iconset/icon_512x512.png
          sips -z 1024 1024 assets/meetingscribe-icon.png --out assets/meetingscribe-icon.iconset/icon_512x512@2x.png
          iconutil -c icns assets/meetingscribe-icon.iconset -o assets/meetingscribe-icon.icns

      - name: Build macOS application
        run: pyinstaller --noconfirm MeetingScribe.spec

      - name: Download verified Ollama app
        run: |
          mkdir -p vendor
          curl --fail --location --retry 3 \
            --output vendor/Ollama-darwin.zip \
            "https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/Ollama-darwin.zip"
          echo "${OLLAMA_SHA256}  vendor/Ollama-darwin.zip" | shasum -a 256 --check
          ditto -x -k vendor/Ollama-darwin.zip vendor
          test -d vendor/Ollama.app
          codesign --verify --deep --strict vendor/Ollama.app
          architectures="$(lipo -archs vendor/Ollama.app/Contents/MacOS/Ollama)"
          echo "$architectures" | grep -q arm64
          echo "$architectures" | grep -q x86_64

      - name: Ad-hoc sign and smoke test
        env:
          QT_QPA_PLATFORM: minimal
        run: |
          codesign --force --deep --sign - dist/MeetingScribe.app
          dist/MeetingScribe.app/Contents/MacOS/MeetingScribe --smoke-test
          codesign --verify --deep --strict dist/MeetingScribe.app

      - name: Create guided installer disk image
        run: |
          mkdir -p dmg-root
          osacompile -o "dmg-root/Install MeetingScribe.app" \
            "macos/Install MeetingScribe.applescript"
          mkdir -p "dmg-root/Install MeetingScribe.app/Contents/Resources/Payload"
          ditto dist/MeetingScribe.app \
            "dmg-root/Install MeetingScribe.app/Contents/Resources/Payload/MeetingScribe.app"
          ditto vendor/Ollama.app \
            "dmg-root/Install MeetingScribe.app/Contents/Resources/Payload/Ollama.app"
          cp "macos/READ ME FIRST.txt" dmg-root/
          cp macos/OLLAMA-LICENSE.txt dmg-root/
          cp macos/THIRD-PARTY-NOTICES.txt dmg-root/
          codesign --force --sign - "dmg-root/Install MeetingScribe.app"
          codesign --verify --deep --strict "dmg-root/Install MeetingScribe.app"
          hdiutil create -volname "MeetingScribe" -srcfolder dmg-root -ov -format UDZO \
            "MeetingScribe-0.4.1-beta-macOS-${{ matrix.architecture }}.dmg"

      - name: Verify installer disk image
        run: |
          mount_point="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse \
            -mountpoint "$mount_point" \
            "MeetingScribe-0.4.1-beta-macOS-${{ matrix.architecture }}.dmg"
          test -d "$mount_point/Install MeetingScribe.app"
          test -d "$mount_point/Install MeetingScribe.app/Contents/Resources/Payload/MeetingScribe.app"
          test -d "$mount_point/Install MeetingScribe.app/Contents/Resources/Payload/Ollama.app"
          test -f "$mount_point/OLLAMA-LICENSE.txt"
          test -f "$mount_point/THIRD-PARTY-NOTICES.txt"
          codesign --verify --deep --strict "$mount_point/Install MeetingScribe.app"
          hdiutil detach "$mount_point"

      - name: Upload macOS disk image
        uses: actions/upload-artifact@v4
        with:
          name: MeetingScribe-macOS-${{ matrix.architecture }}
          path: tools/meetingscribe/MeetingScribe-0.4.1-beta-macOS-${{ matrix.architecture }}.dmg
          if-no-files-found: error
