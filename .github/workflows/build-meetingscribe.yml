name: Build MeetingScribe for Windows

on:
  pull_request:
    paths:
      - "tools/meetingscribe/**"
      - ".github/workflows/build-meetingscribe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/meetingscribe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/meetingscribe/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate source
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build application
        run: pyinstaller --noconfirm MeetingScribe.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build one-click installer
        run: ISCC.exe installer.iss

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeetingScribe-Windows-Setup
          path: tools/meetingscribe/installer-output/MeetingScribe-*-One-Click-Windows-Setup.exe
          if-no-files-found: error

      # Release installers are uploaded separately after validation. CI artifacts
      # must not replace a verified public installer when a tag is created.
